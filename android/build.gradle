buildscript {
    //ext.kotlin_version = '2.0.21' // newly added
    ext.kotlin_version = '1.9.10'   
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.8.2'  // Existing Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.4.0'  // Add this line for Firebase
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { 
           url = "https://s3.ap-south-1.amazonaws.com/hvsdk/android/releases"
        } 
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
